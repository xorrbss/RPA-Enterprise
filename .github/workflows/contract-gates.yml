name: Contract Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  contract-lint:
    name: Root contract lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check authoritative contracts
        run: node scripts/contract-lint.mjs

      - name: Audit app test wiring (no CI-orphan tests)
        run: node scripts/test-wiring-audit.mjs

      - name: File-length gate (500-line rule, baseline ratchet)
        run: node scripts/file-length-gate.mjs

  blocked-decision-audit:
    name: Blocked decision audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check blocked release decisions
        run: node scripts/blocked-decisions-audit.mjs

  codegen:
    name: Codegen typecheck, fixtures, validators, consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codegen/package-lock.json

      - name: Install codegen dependencies
        run: npm ci --prefix codegen

      - name: Typecheck generated and shared TS contracts
        run: npm --prefix codegen run typecheck

      - name: Run state-machine fixtures
        run: npm --prefix codegen run fixtures

      - name: Run schema and static-validation fixtures
        run: npm --prefix codegen run validators

      - name: Run cross-contract consistency
        run: npm --prefix codegen run consistency

      - name: Lint OpenAPI/AsyncAPI specs (spectral)
        run: npm --prefix codegen run spectral

      - name: Run full codegen test gate
        run: npm --prefix codegen test

  yaml-parse:
    name: Workflow, OpenAPI, and AsyncAPI YAML parse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes python3-yaml

      - name: Parse YAML artifacts
        run: python3 scripts/yaml-parse.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check secret scan workflow hazard fixtures
        run: node scripts/secret-scan.mjs --self-test

      - name: Check staging release packet validator fixtures
        run: node scripts/validate-staging-release-packet.mjs --self-test

      - name: Check controlled-prod readiness packet validator fixtures
        run: node scripts/validate-controlled-prod-readiness-packet.mjs --self-test

      - name: Scan for high-risk secret material and staging workflow hazards
        run: node scripts/secret-scan.mjs

  db-static-smoke:
    name: DB static smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check migration contracts without PostgreSQL
        run: node scripts/db-static-smoke.mjs

  # R4-1: 배포 매니페스트(k8s base/overlay·helm·Dockerfile·compose) 정적 검증이 로컬 게이트에만 있어
  # 매니페스트를 깨는 변경이 PR CI를 통과하던 갭 — run-local-gates 와 동일 스텝을 CI에 배선.
  k8s-static-smoke:
    name: Kubernetes packaging static smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 스텝 이름에 'deploy' 금지 — yaml-parse.py DEPLOY_MARKERS 가드(contract-only workflow)가 문자열로 걸러낸다.
      - name: Check k8s packaging manifests without a cluster
        run: node scripts/k8s-static-smoke.mjs

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes python3-yaml

      # 정적 regex 로는 템플릿이 실제로 렌더되는지, 렌더된 워크로드가 런타임 필수 env 를 갖는지 알 수 없다.
      # 렌더만 하고 클러스터에는 적용하지 않는다(읽기 전용).
      - name: Render packaging manifests without a cluster
        run: python3 scripts/k8s-render-smoke.py

  db-migration-smoke:
    name: PostgreSQL 15 migration smoke
    runs-on: ubuntu-latest
    # These visible postgres/rpa_smoke values are isolated service-container
    # credentials for CI smoke only. They are not staging SecretStore
    # provisioning evidence and must not be reused for deploy/runtime material.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: rpa_contract_gate
      PGADMIN_USER: postgres
      PGSMOKE_USER: rpa_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Show db:smoke requirements
        shell: bash
        run: |
          set -euo pipefail
          echo "db:smoke requires a PostgreSQL 15+ server and psql client."
          echo "CI provides postgres:15 at PGHOST=${PGHOST}, PGPORT=${PGPORT}, PGDATABASE=${PGDATABASE}."
          echo "CI runs db:smoke as ${PGSMOKE_USER}, a non-SUPERUSER/non-BYPASSRLS role, so RLS/redaction assertions are not skipped."
          echo "Release evidence command: npm --prefix codegen run db:smoke:release or node scripts/db-migration-smoke.mjs --require-non-bypass."
          echo "Local full equivalents: npm --prefix codegen run ci:local:temp-db, or ci:local when PG env already points at a non-bypass role; ci:local:no-db is diagnostic skip-only."
          psql --version
          pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGADMIN_USER}" -d postgres

      - name: Prepare non-bypass db:smoke role and database
        shell: bash
        env:
          PGADMIN_PASSWORD: postgres
          PGSMOKE_PASSWORD: rpa_smoke
        run: |
          set -euo pipefail
          echo "::add-mask::${PGADMIN_PASSWORD}"
          echo "::add-mask::${PGSMOKE_PASSWORD}"
          export PGUSER="${PGADMIN_USER}"
          export PGPASSWORD="${PGADMIN_PASSWORD}"
          psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rpa_smoke') THEN
              CREATE ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            ELSE
              ALTER ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END;
          $$;
          SQL
          psql -v ON_ERROR_STOP=1 -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${PGDATABASE}'" | grep -q 1 || createdb --owner "${PGSMOKE_USER}" "${PGDATABASE}"
          psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER DATABASE ${PGDATABASE} OWNER TO ${PGSMOKE_USER}"
          psql -v ON_ERROR_STOP=1 -d postgres -Atqc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = '${PGSMOKE_USER}'" | grep -qx f

      - name: Run migration contract smoke
        env:
          PGUSER: ${{ env.PGSMOKE_USER }}
          PGPASSWORD: rpa_smoke
        run: node scripts/db-migration-smoke.mjs --require-non-bypass

  app-runtime:
    name: App runtime typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: rpa_contract_gate
      PGADMIN_USER: postgres
      PGSMOKE_USER: rpa_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            codegen/package-lock.json
            app/package-lock.json

      - name: Install codegen dependencies
        run: npm ci --prefix codegen

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Typecheck app runtime
        run: npm --prefix app run typecheck

      - name: Typecheck dev tooling (dev/ — previously typecheck-blind)
        run: npm --prefix app run typecheck:dev

      - name: Lint app runtime (secret-taint gate)
        run: npm --prefix app run lint

      - name: Run app unit tests
        run: npm --prefix app run test:unit

      - name: Locate Chrome for D3 executor dry-run
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROME}" ]; then
            echo "Chrome or Chromium is required for npm --prefix app run test:executor"
            exit 1
          fi
          echo "CHROME_PATH=${CHROME}" >> "${GITHUB_ENV}"

      - name: Run D3 executor dry-run tests
        run: npm --prefix app run test:executor

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Prepare non-bypass app integration role and database
        shell: bash
        env:
          PGADMIN_PASSWORD: postgres
          PGSMOKE_PASSWORD: rpa_smoke
        run: |
          set -euo pipefail
          echo "::add-mask::${PGADMIN_PASSWORD}"
          echo "::add-mask::${PGSMOKE_PASSWORD}"
          export PGUSER="${PGADMIN_USER}"
          export PGPASSWORD="${PGADMIN_PASSWORD}"
          psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rpa_smoke') THEN
              CREATE ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            ELSE
              ALTER ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END;
          $$;
          SQL
          psql -v ON_ERROR_STOP=1 -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${PGDATABASE}'" | grep -q 1 || createdb --owner "${PGSMOKE_USER}" "${PGDATABASE}"
          psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER DATABASE ${PGDATABASE} OWNER TO ${PGSMOKE_USER}"
          psql -v ON_ERROR_STOP=1 -d postgres -Atqc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = '${PGSMOKE_USER}'" | grep -qx f

      - name: Run app integration tests
        env:
          PGUSER: ${{ env.PGSMOKE_USER }}
          PGPASSWORD: rpa_smoke
          # superuser 비밀번호: runtime-worker-claim.int가 BYPASSRLS 역할 생성에 postgres로 접속(격리 service-container 자격).
          PGADMIN_PASSWORD: postgres
        run: npm --prefix app run test:int

      # 풀스택 D3 파이프라인(driver + 실 Chrome + DB) — CHROME_PATH(Locate Chrome 단계)와 비-bypass DB가
      # 둘 다 준비된 뒤 실행. test:int(순수-DB)와 분리해 명시·격리(플레이키 시 RQ-001 규율로 rerun).
      - name: Run full-stack D3 run-pipeline integration (driver + Chrome + DB)
        env:
          PGUSER: ${{ env.PGSMOKE_USER }}
          PGPASSWORD: rpa_smoke
        run: |
          npm --prefix app run test:pipeline-run
          npm --prefix app run test:pipeline-site

      - name: Install and build console for live e2e
        run: |
          npm ci --prefix web
          npm --prefix web run build

      - name: Run console live e2e (browser to API to PostgreSQL)
        env:
          PGUSER: ${{ env.PGSMOKE_USER }}
          PGPASSWORD: rpa_smoke
        run: npm --prefix app run test:console-live-e2e

  html-smoke:
    name: HTML console smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Static smoke for standalone console
        run: node scripts/html-smoke.mjs

      - name: Local HTTP smoke for standalone console
        run: node scripts/html-http-smoke.mjs

  console:
    name: Operations console (web) typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install console dependencies
        run: npm ci --prefix web

      - name: Typecheck console
        run: npm --prefix web run typecheck

      - name: Run console tests
        run: npm --prefix web run test

      - name: Copy gate (user-facing terminology)
        run: npm --prefix web run lint:copy

      - name: Build console
        run: npm --prefix web run build

      - name: Install app dependencies (puppeteer-core for e2e)
        run: npm ci --prefix app

      - name: Locate Chrome for console browser e2e
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROME}" ]; then
            echo "Chrome or Chromium is required for the console browser e2e"
            exit 1
          fi
          echo "CHROME_PATH=${CHROME}" >> "${GITHUB_ENV}"

      - name: Run console browser e2e
        run: npm --prefix app run test:console-e2e

  container-stack-boot:
    name: Container stack boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # These visible compose passwords are throwaway values for an ephemeral CI
    # container stack that is torn down in the same job. They are not staging
    # SecretStore provisioning evidence and must not be reused for any real
    # environment or runtime material.
    env:
      POSTGRES_PASSWORD: ci-compose-postgres
      RPA_MIGRATOR_DB_PASSWORD: ci-compose-migrator
      RPA_APP_DB_PASSWORD: ci-compose-app
      RPA_LIFECYCLE_BYPASS_DB_PASSWORD: ci-compose-lifecycle
      JWT_HS256_SECRET: ci-compose-boot-smoke-hs256-key-0123456789abcdef
      RPA_API_PORT: "8080"
      RPA_HEALTH_PORT: "8081"
      RPA_CONSOLE_PORT: "8088"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build runtime and console images
        run: docker compose build

      - name: Boot the container stack (postgres, role bootstrap, migrations, API, console)
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 300 api web

      - name: Assert the migration container ran the real graphile step
        shell: bash
        run: |
          set -euo pipefail
          docker compose logs migrate > migrate.log
          cat migrate.log
          grep -q "applying graphile-worker schema migrations" migrate.log
          grep -q "db migrate: complete" migrate.log

      - name: Assert API readiness probe and console are served
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "http://127.0.0.1:${RPA_HEALTH_PORT}/readyz"
          curl -fsS "http://127.0.0.1:${RPA_CONSOLE_PORT}/" | grep -qi "<!doctype html"

      # 브라우저 worker(RUN_MODE=worker)는 부팅 즉시 Vault 에서 세션 KEK/resume-token HMAC 을 해소하므로
      # 오너가 프로비저닝한 SecretStore 없이는 뜰 수 없다(fail-closed, 우회 모드 없음). lifecycle-worker 는
      # local_fs 오브젝트 스토어에서 Vault 를 요구하지 않으므로(env-artifact-lifecycle: s3 모드에서만 필요)
      # 여기서 실제로 기동해 이미지·env·BYPASSRLS 접속·graphile external 모드를 검증한다.
      - name: Boot the artifact lifecycle worker
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile worker up -d --wait --wait-timeout 240 lifecycle-worker

      # lifecycle-worker 에는 healthcheck 가 없어 `up --wait` 는 "running" 만으로 통과한다(데몬 준비 완료가 아님).
      # 준비 신호(로그 + workers heartbeat 행)를 폴링한다.
      - name: Assert the lifecycle worker runs and registers a live heartbeat
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            docker compose logs lifecycle-worker > lifecycle-worker.log 2>&1 || true
            heartbeat="$(docker compose exec -T postgres \
              psql -U postgres -d rpa -Atqc \
              "SELECT status || ':' || kind FROM workers WHERE id = '20000000-0000-4000-8000-0000000000aa'" 2>/dev/null || true)"
            if grep -q "artifact lifecycle worker daemon running" lifecycle-worker.log \
              && [ "${heartbeat}" = "active:sweeper" ]; then
              echo "lifecycle worker ready after ${attempt} attempt(s): heartbeat=${heartbeat}"
              cat lifecycle-worker.log
              exit 0
            fi
            sleep 2
          done
          echo "lifecycle worker did not become ready"
          cat lifecycle-worker.log
          exit 1

      # 브라우저 worker 는 dev Vault(profile worker)에서 AppRole 로그인 → 세션 KEK 해소를 거쳐야 뜬다.
      # 제품의 보안 경계(https 강제·AppRole·fail-closed)는 그대로 두고 실제 TLS Vault 를 세워 통과시킨다.
      - name: Boot the browser worker against the local Vault
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile worker up -d --wait --wait-timeout 300 worker

      - name: Assert the browser worker runs and registers a live heartbeat
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            docker compose logs worker > worker.log 2>&1 || true
            heartbeat="$(docker compose exec -T postgres \
              psql -U postgres -d rpa -Atqc \
              "SELECT status || ':' || kind FROM workers WHERE id = '10000000-0000-4000-8000-0000000000aa'" 2>/dev/null || true)"
            if grep -q "worker daemon running" worker.log && [ "${heartbeat}" = "active:browser" ]; then
              echo "browser worker ready after ${attempt} attempt(s): heartbeat=${heartbeat}"
              cat worker.log
              exit 0
            fi
            sleep 2
          done
          echo "browser worker did not become ready"
          cat worker.log
          docker compose logs vault-init
          exit 1

      # 여기까지는 "스택이 뜬다"만 증명한다. 실제로 자동화를 실행하는지는 별개 문제 — 배포된 API 로 사이트·시나리오를
      # 만들고 run 을 큐에 넣어, 컨테이너 워커가 이미지의 Chromium 으로 completed 까지 몰고 가는지 확인한다.
      - name: Serve the automation target fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile fixture up -d --wait --wait-timeout 120 fixture

      # 스텝 이름에 'deploy' 금지 — yaml-parse.py DEPLOY_MARKERS 가드가 문자열로 걸러낸다.
      - name: Drive a real run through the running stack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/container-e2e-run.mjs

      - name: Worker logs after the run
        if: always()
        run: docker compose logs --tail 120 worker

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 200

      - name: Tear down the container stack
        if: always()
        run: docker compose down -v
