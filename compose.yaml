name: rpa-enterprise

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rpa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the local compose database}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rpa}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rpa_pgdata:/var/lib/postgresql/data

  role-bootstrap:
    image: rpa-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rpa}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RPA_MIGRATOR_DB_USER: ${RPA_MIGRATOR_DB_USER:-rpa_migrator}
      RPA_MIGRATOR_DB_PASSWORD: ${RPA_MIGRATOR_DB_PASSWORD:?set RPA_MIGRATOR_DB_PASSWORD}
      RPA_APP_DB_USER: ${RPA_APP_DB_USER:-rpa_app}
      RPA_APP_DB_PASSWORD: ${RPA_APP_DB_PASSWORD:?set RPA_APP_DB_PASSWORD}
      RPA_LIFECYCLE_BYPASS_DB_USER: ${RPA_LIFECYCLE_BYPASS_DB_USER:-rpa_lifecycle_bypass}
      RPA_LIFECYCLE_BYPASS_DB_PASSWORD: ${RPA_LIFECYCLE_BYPASS_DB_PASSWORD:?set RPA_LIFECYCLE_BYPASS_DB_PASSWORD}
    command:
      - sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -f db/roles.sql
        # psql 은 -c 문자열에서 변수 보간(:'var' / :"var")을 하지 않는다 — 콜론이 그대로 서버로 가 syntax error 가
        # 난다. 보간은 stdin/파일 입력에서만 일어나므로 heredoc 으로 넣는다(비밀번호는 인자로 노출하지 않는다).
        psql -v ON_ERROR_STOP=1 \
          -v migrator_user="$$RPA_MIGRATOR_DB_USER" \
          -v migrator_password="$$RPA_MIGRATOR_DB_PASSWORD" \
          -v app_user="$$RPA_APP_DB_USER" \
          -v app_password="$$RPA_APP_DB_PASSWORD" \
          -v lifecycle_user="$$RPA_LIFECYCLE_BYPASS_DB_USER" \
          -v lifecycle_password="$$RPA_LIFECYCLE_BYPASS_DB_PASSWORD" \
          <<'SQL'
        ALTER ROLE :"migrator_user" LOGIN PASSWORD :'migrator_password';
        ALTER ROLE :"app_user" LOGIN PASSWORD :'app_password';
        ALTER ROLE :"lifecycle_user" LOGIN PASSWORD :'lifecycle_password';
        SQL
    restart: "no"

  migrate:
    image: rpa-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rpa}
      PGUSER: ${RPA_MIGRATOR_DB_USER:-rpa_migrator}
      PGPASSWORD: ${RPA_MIGRATOR_DB_PASSWORD:?set RPA_MIGRATOR_DB_PASSWORD}
    command: ["node", "scripts/db-migrate.mjs", "--baseline-existing", "--graphile-worker", "--smoke", "--require-non-bypass"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rpa-runtime:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      RUN_MODE: api
      RPA_ENV: ${RPA_ENV:-local}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rpa}
      PGUSER: ${RPA_APP_DB_USER:-rpa_app}
      PGPASSWORD: ${RPA_APP_DB_PASSWORD:?set RPA_APP_DB_PASSWORD}
      PORT: "8080"
      HEALTH_PORT: "8081"
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:?set JWT_HS256_SECRET to at least 32 characters}
      SIGNED_COMMAND_REGISTRY_MODE: ${SIGNED_COMMAND_REGISTRY_MODE:-deny_all}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      SCENARIO_GENERATION_LLM_V1_ENABLED: ${SCENARIO_GENERATION_LLM_V1_ENABLED:-false}
      VISUAL_EVIDENCE_VIDEO_ENABLED: ${VISUAL_EVIDENCE_VIDEO_ENABLED:-false}
      GATEWAY_ARTIFACT_DIR: /var/lib/rpa/artifacts
      # 아티팩트 조회는 프로덕션과 동일한 s3 모드. 시크릿 키는 SecretRef 로만(평문 env 금지).
      ARTIFACT_OBJECT_STORE_KIND: ${ARTIFACT_OBJECT_STORE_KIND:-s3}
      ARTIFACT_OBJECT_STORE_REF: rpa/${RPA_ENV:-local}/artifact-lifecycle/object_store/artifacts
      ARTIFACT_OBJECT_STORE_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-https://minio:9000}
      ARTIFACT_OBJECT_STORE_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_OBJECT_STORE_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-rpa-artifacts}
      ARTIFACT_OBJECT_STORE_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-rpa-local-dev-artifact-writer}
      ARTIFACT_OBJECT_STORE_S3_FORCE_PATH_STYLE: "true"
      VAULT_ADDR: ${VAULT_ADDR:-https://vault:8200}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_API_ROLE_ID: ${VAULT_API_ROLE_ID:-rpa-local-dev-api-role}
      VAULT_API_SECRET_ID: ${VAULT_API_SECRET_ID:-rpa-local-dev-api-secret}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/vault/tls/vault-ca.pem}
    ports:
      - "${RPA_API_PORT:-8080}:8080"
      - "${RPA_HEALTH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rpa_artifacts:/var/lib/rpa/artifacts
      - rpa_vault_tls:/vault/tls:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: console-runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_OIDC_AUTH_URL: ${VITE_OIDC_AUTH_URL:-}
    image: rpa-console:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      RPA_API_UPSTREAM: http://api:8080
    ports:
      - "${RPA_CONSOLE_PORT:-8088}:8080"

  # 자동화 대상 픽스처 사이트(개발/CI 전용). 워커가 실제로 run 을 완주하는지 증명하려면 컨테이너 네트워크
  # 안에서 접근 가능한 대상 페이지가 필요하다. 제품 이미지가 아니라 nginx 로 정적 파일만 서빙한다.
  fixture:
    profiles: ["fixture"]
    image: nginx:alpine
    volumes:
      - ./app/test/fixtures/site:/usr/share/nginx/html:ro

  # 로컬 SecretStore. 브라우저 worker 는 부팅 즉시 세션 KEK/resume-token HMAC 을 Vault 에서 해소하고
  # VaultSecretStore 는 https 를 강제한다(우회 모드 없음) — 그래서 로컬 스택에도 실제 TLS Vault 가 필요하다.
  # 실 배포는 항상 SecretStore + 오브젝트 스토어를 갖는다. 로컬 스택이 그 형상과 갈리면 "배포하지 않는 설정"을
  # 테스트하게 되므로 vault/minio 는 프로필 없이 상시 기동한다.
  # 개발/CI 전용: dev 모드(인메모리, 고정 root 토큰). 실 배포는 오너 Vault 를 VAULT_* 로 주입해 이 기본값을 덮는다.
  vault:
    image: hashicorp/vault:1.17
    user: "0:0"
    entrypoint: ["vault"]
    command:
      - server
      - -dev
      - -dev-tls
      - -dev-tls-cert-dir=/vault/tls
      # minio 가 같은 인증서를 재사용한다(자체 서명 CA 하나로 두 서비스의 TLS 를 덮는다).
      # ⚠ -dev-tls-san 은 콤마 목록을 쪼개지 않는다(SAN 이 "vault,minio" 한 덩어리가 된다) — 플래그를 반복한다.
      - -dev-tls-san=vault
      - -dev-tls-san=minio
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:-rpa-local-dev-root}
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=https://127.0.0.1:8200 -ca-cert=/vault/tls/vault-ca.pem >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - rpa_vault_tls:/vault/tls

  # 아티팩트 오브젝트 스토어(S3 호환). 프로덕션 ConfigMap 이 GATEWAY_ARTIFACT_STORE_MODE=s3 /
  # ARTIFACT_LIFECYCLE_OBJECT_STORE_MODE=s3 / ARTIFACT_OBJECT_STORE_KIND=s3 를 켜므로 로컬도 같은 모드로 돈다.
  # S3ObjectStore 는 https 를 강제하므로 vault 의 자체 서명 인증서(SAN 에 minio 포함)를 재사용해 TLS 로 서빙한다.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      vault:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ARTIFACT_S3_ACCESS_KEY_ID:-rpa-local-dev-artifact-writer}
      MINIO_ROOT_PASSWORD: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-rpa-local-dev-artifact-secret-key}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        mkdir -p /certs/CAs
        cp /vault/tls/vault-cert.pem /certs/public.crt
        cp /vault/tls/vault-key.pem /certs/private.key
        cp /vault/tls/vault-ca.pem /certs/CAs/vault-ca.pem
        exec minio server /data --certs-dir /certs --address :9000
    volumes:
      - rpa_vault_tls:/vault/tls:ro
      - rpa_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${ARTIFACT_S3_ACCESS_KEY_ID:-rpa-local-dev-artifact-writer}
      MINIO_ROOT_PASSWORD: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-rpa-local-dev-artifact-secret-key}
      ARTIFACT_BUCKET: ${ARTIFACT_S3_BUCKET:-rpa-artifacts}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        mkdir -p /root/.mc/certs/CAs
        cp /vault/tls/vault-ca.pem /root/.mc/certs/CAs/vault-ca.pem
        i=0
        until mc alias set local https://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1)); [ "$$i" -ge 30 ] && { echo "minio-init: minio did not become ready"; exit 1; }
          sleep 2
        done
        mc mb --ignore-existing "local/$$ARTIFACT_BUCKET"
        echo "minio-init: bucket $$ARTIFACT_BUCKET ready"
    volumes:
      - rpa_vault_tls:/vault/tls:ro
    restart: "no"

  # AppRole + 최소권한 정책 + 시크릿 시드(개발/CI 전용 고정값). identity 별로 자기 namespace 만 read 한다.
  # 시크릿 페이로드는 {kid,key} JSON — browser_session KEK 는 base64 32바이트(AES-256-GCM).
  # 오브젝트 스토어 secret access key 는 SecretRef 로만 전달된다(env 로 평문 전달 금지 — security-contracts).
  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/vault-ca.pem
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-rpa-local-dev-root}
      RPA_ENV: ${RPA_ENV:-local}
      RUNTIME_WORKER_ROLE_ID: ${VAULT_RUNTIME_WORKER_ROLE_ID:-rpa-local-dev-runtime-worker-role}
      RUNTIME_WORKER_SECRET_ID: ${VAULT_RUNTIME_WORKER_SECRET_ID:-rpa-local-dev-runtime-worker-secret}
      LIFECYCLE_ROLE_ID: ${VAULT_ARTIFACT_LIFECYCLE_ROLE_ID:-rpa-local-dev-artifact-lifecycle-role}
      LIFECYCLE_SECRET_ID: ${VAULT_ARTIFACT_LIFECYCLE_SECRET_ID:-rpa-local-dev-artifact-lifecycle-secret}
      API_ROLE_ID: ${VAULT_API_ROLE_ID:-rpa-local-dev-api-role}
      API_SECRET_ID: ${VAULT_API_SECRET_ID:-rpa-local-dev-api-secret}
      BROWSER_SESSION_KEK: ${VAULT_DEV_BROWSER_SESSION_KEK:-BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=}
      RESUME_TOKEN_KEY: ${VAULT_DEV_RESUME_TOKEN_KEY:-rpa-local-dev-resume-token-hmac-key}
      ARTIFACT_S3_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_ACCESS_KEY:-rpa-local-dev-artifact-secret-key}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        vault auth enable approle 2>/dev/null || true

        vault policy write runtime-worker - <<POLICY
        path "secret/data/rpa/$$RPA_ENV/runtime-worker/*" {
          capabilities = ["read"]
        }
        POLICY
        vault write auth/approle/role/runtime-worker \
          token_policies=runtime-worker token_ttl=1h token_max_ttl=4h
        vault write auth/approle/role/runtime-worker/role-id role_id="$$RUNTIME_WORKER_ROLE_ID"
        # custom-secret-id 는 이미 등록돼 있으면 500 을 낸다. compose 는 완료된 one-shot 을 재기동하므로 멱등해야 한다.
        vault write auth/approle/role/runtime-worker/custom-secret-id secret_id="$$RUNTIME_WORKER_SECRET_ID" || echo "vault-init: runtime-worker secret_id already registered"

        # artifact-lifecycle 워커와 API 는 같은 오브젝트 스토어 자격을 읽는다
        # (ConfigMap 의 ARTIFACT_OBJECT_STORE_REF 가 artifact-lifecycle namespace 를 가리킨다).
        vault policy write artifact-lifecycle - <<POLICY
        path "secret/data/rpa/$$RPA_ENV/artifact-lifecycle/*" {
          capabilities = ["read"]
        }
        POLICY
        vault write auth/approle/role/artifact-lifecycle \
          token_policies=artifact-lifecycle token_ttl=1h token_max_ttl=4h
        vault write auth/approle/role/artifact-lifecycle/role-id role_id="$$LIFECYCLE_ROLE_ID"
        vault write auth/approle/role/artifact-lifecycle/custom-secret-id secret_id="$$LIFECYCLE_SECRET_ID" || echo "vault-init: artifact-lifecycle secret_id already registered"

        # API 는 자기 namespace(세션 캡처 KEK — staging 런북 §4.1)와 아티팩트 오브젝트 스토어 자격을 읽는다.
        vault policy write api - <<POLICY
        path "secret/data/rpa/$$RPA_ENV/api/*" {
          capabilities = ["read"]
        }
        path "secret/data/rpa/$$RPA_ENV/artifact-lifecycle/*" {
          capabilities = ["read"]
        }
        POLICY
        vault write auth/approle/role/api \
          token_policies=api token_ttl=1h token_max_ttl=4h
        vault write auth/approle/role/api/role-id role_id="$$API_ROLE_ID"
        vault write auth/approle/role/api/custom-secret-id secret_id="$$API_SECRET_ID" || echo "vault-init: api secret_id already registered"

        vault kv put secret/rpa/$$RPA_ENV/runtime-worker/browser_session/active \
          value="{\"kid\":\"dev-1\",\"key\":\"$$BROWSER_SESSION_KEK\"}"
        vault kv put secret/rpa/$$RPA_ENV/runtime-worker/resume_token_hmac/active \
          value="{\"kid\":\"dev-1\",\"key\":\"$$RESUME_TOKEN_KEY\"}"
        vault kv put secret/rpa/$$RPA_ENV/runtime-worker/object_store/artifacts \
          value="$$ARTIFACT_S3_SECRET_ACCESS_KEY"
        vault kv put secret/rpa/$$RPA_ENV/artifact-lifecycle/object_store/artifacts \
          value="$$ARTIFACT_S3_SECRET_ACCESS_KEY"
        # API 세션 캡처 KEK — Vault identity 를 가진 API 는 부팅 시 이 값을 fail-closed 로 요구한다.
        vault kv put secret/rpa/$$RPA_ENV/api/browser_session/active \
          value="{\"kid\":\"dev-1\",\"key\":\"$$BROWSER_SESSION_KEK\"}"
        echo "vault-init: AppRoles (runtime-worker, artifact-lifecycle, api) and secrets seeded"
    volumes:
      - rpa_vault_tls:/vault/tls:ro
    restart: "no"

  worker:
    profiles: ["worker"]
    image: rpa-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
    # Chromium 의 user-namespace 샌드박스는 namespace clone 을 필요로 하는데 런타임 기본 seccomp 프로파일이 이를
    # 막는다 → 샌드박스가 아예 서지 못해(No usable sandbox / Operation not permitted) 워커가 모든 run 을 INIT
    # 실패로 재큐한다. 이 워크로드에 한해 seccomp 필터만 해제한다 — non-root·capability drop·privilege escalation
    # 금지는 그대로 유지되고, **브라우저 샌드박스는 켜진 채로** 동작한다(--no-sandbox 회피 금지: 워커는 외부 웹
    # 콘텐츠를 렌더하고 컨테이너 안에 Vault AppRole·DB 자격이 있다). 실측: 이 조합에서만 샌드박스 ON 렌더 성공.
    security_opt:
      - seccomp=unconfined
    depends_on:
      migrate:
        condition: service_completed_successfully
      lifecycle-worker:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      RUN_MODE: worker
      ARTIFACT_LIFECYCLE_CONSUMER: external
      RPA_ENV: ${RPA_ENV:-local}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rpa}
      PGUSER: ${RPA_APP_DB_USER:-rpa_app}
      PGPASSWORD: ${RPA_APP_DB_PASSWORD:?set RPA_APP_DB_PASSWORD}
      MAINTENANCE_LIFECYCLE_DATABASE_URL: postgresql://${RPA_LIFECYCLE_BYPASS_DB_USER:-rpa_lifecycle_bypass}:${RPA_LIFECYCLE_BYPASS_DB_PASSWORD:?set RPA_LIFECYCLE_BYPASS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-rpa}
      GRAPHILE_MIGRATIONS_MODE: external
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      WORKER_ID: ${WORKER_ID:-10000000-0000-4000-8000-0000000000aa}
      WORKER_POOL_KEYS: ${WORKER_POOL_KEYS:-}
      MAINTENANCE_TENANT_IDS: ${MAINTENANCE_TENANT_IDS:-}
      GRAPHILE_CONCURRENCY: ${GRAPHILE_CONCURRENCY:-1}
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      # loadGatewayConfig 는 CODEX_* 를 무조건 요구한다(https 강제). 로컬 기본값은 호출되지 않는 플레이스홀더 —
      # 실 LLM 을 쓰려면 오너가 덮어쓴다(scripts/run-local-staging-pilot.mjs 와 동일 규약).
      CODEX_BASE_URL: ${CODEX_BASE_URL:-https://codex.invalid/v1}
      CODEX_API_KEY: ${CODEX_API_KEY:-local-nonsecret-placeholder}
      CODEX_MODEL: ${CODEX_MODEL:-local-model-alias}
      # 프로덕션 ConfigMap 과 동일한 s3 모드. 시크릿 키는 SecretRef 로만 전달된다(평문 env 금지).
      GATEWAY_ARTIFACT_STORE_MODE: ${GATEWAY_ARTIFACT_STORE_MODE:-s3}
      GATEWAY_ARTIFACT_OBJECT_STORE_REF: rpa/${RPA_ENV:-local}/runtime-worker/object_store/artifacts
      ARTIFACT_OBJECT_STORE_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-https://minio:9000}
      ARTIFACT_OBJECT_STORE_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_OBJECT_STORE_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-rpa-artifacts}
      ARTIFACT_OBJECT_STORE_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-rpa-local-dev-artifact-writer}
      ARTIFACT_OBJECT_STORE_S3_FORCE_PATH_STYLE: "true"
      GATEWAY_ARTIFACT_DIR: /var/lib/rpa/artifacts
      # 기본값은 위 dev Vault. 실 배포는 오너 Vault 주소/AppRole 로 덮어쓴다.
      VAULT_ADDR: ${VAULT_ADDR:-https://vault:8200}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_RUNTIME_WORKER_ROLE_ID: ${VAULT_RUNTIME_WORKER_ROLE_ID:-rpa-local-dev-runtime-worker-role}
      VAULT_RUNTIME_WORKER_SECRET_ID: ${VAULT_RUNTIME_WORKER_SECRET_ID:-rpa-local-dev-runtime-worker-secret}
      # dev Vault 의 자체 서명 CA. 오너 Vault 가 공인 CA 면 불필요(빈 값으로 덮어쓴다).
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/vault/tls/vault-ca.pem}
      VISUAL_EVIDENCE_VIDEO_ENABLED: ${VISUAL_EVIDENCE_VIDEO_ENABLED:-false}
    volumes:
      - rpa_artifacts:/var/lib/rpa/artifacts
      - rpa_vault_tls:/vault/tls:ro

  lifecycle-worker:
    profiles: ["worker"]
    image: rpa-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      RUN_MODE: lifecycle-worker
      RPA_ENV: ${RPA_ENV:-local}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rpa}
      PGUSER: ${RPA_APP_DB_USER:-rpa_app}
      PGPASSWORD: ${RPA_APP_DB_PASSWORD:?set RPA_APP_DB_PASSWORD}
      ARTIFACT_LIFECYCLE_DATABASE_URL: postgresql://${RPA_LIFECYCLE_BYPASS_DB_USER:-rpa_lifecycle_bypass}:${RPA_LIFECYCLE_BYPASS_DB_PASSWORD:?set RPA_LIFECYCLE_BYPASS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-rpa}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      ARTIFACT_LIFECYCLE_WORKER_ID: ${ARTIFACT_LIFECYCLE_WORKER_ID:-20000000-0000-4000-8000-0000000000aa}
      # 프로덕션 ConfigMap 과 동일한 s3 모드(자격은 Vault SecretRef 로 해소 — artifact-lifecycle AppRole).
      ARTIFACT_LIFECYCLE_OBJECT_STORE_MODE: ${ARTIFACT_LIFECYCLE_OBJECT_STORE_MODE:-s3}
      ARTIFACT_OBJECT_STORE_REF: rpa/${RPA_ENV:-local}/artifact-lifecycle/object_store/artifacts
      ARTIFACT_OBJECT_STORE_BACKEND_ALIAS: s3-compatible
      ARTIFACT_OBJECT_STORE_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-https://minio:9000}
      ARTIFACT_OBJECT_STORE_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_OBJECT_STORE_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-rpa-artifacts}
      ARTIFACT_OBJECT_STORE_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:-rpa-local-dev-artifact-writer}
      ARTIFACT_OBJECT_STORE_S3_FORCE_PATH_STYLE: "true"
      VAULT_ADDR: ${VAULT_ADDR:-https://vault:8200}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_ARTIFACT_LIFECYCLE_ROLE_ID: ${VAULT_ARTIFACT_LIFECYCLE_ROLE_ID:-rpa-local-dev-artifact-lifecycle-role}
      VAULT_ARTIFACT_LIFECYCLE_SECRET_ID: ${VAULT_ARTIFACT_LIFECYCLE_SECRET_ID:-rpa-local-dev-artifact-lifecycle-secret}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/vault/tls/vault-ca.pem}
      GATEWAY_ARTIFACT_DIR: /var/lib/rpa/artifacts
      GRAPHILE_CONCURRENCY: ${ARTIFACT_LIFECYCLE_GRAPHILE_CONCURRENCY:-1}
    volumes:
      - rpa_artifacts:/var/lib/rpa/artifacts
      - rpa_vault_tls:/vault/tls:ro

volumes:
  rpa_pgdata:
  rpa_artifacts:
  rpa_vault_tls:
  rpa_minio_data:
