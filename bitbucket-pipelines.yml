# Contract Gates (Bitbucket Pipelines) — .github/workflows/contract-gates.yml 의 이식본.
#
# 계약 전용 CI다: 빌드·테스트·정적 검증만 하고 배포는 하지 않는다(scripts/yaml-parse.py 의 DEPLOY_MARKERS
# 가드가 이 파일에도 적용된다 — 스텝 이름/스크립트에 deploy·kubectl·helm upgrade 등을 쓰면 게이트가 실패한다).
#
# GitHub 러너와 다른 점(이식 시 반드시 유지할 것):
#  - Chrome: ubuntu-latest 에는 선설치돼 있지만 node 이미지에는 없다. chromium 을 apt 로 설치하고, 없으면
#    **하드 실패**시킨다. e2e 스위트들은 Chrome 미발견 시 exit(0) 으로 조용히 SKIP 하므로(console-browser.e2e.ts,
#    console-live.e2e.ts) 이 가드가 없으면 브라우저 게이트가 통째로 no-op 이 된다.
#  - CHROME_PATH: executor 테스트는 /usr/bin 을 탐색하지 않고 CHROME_PATH 만 읽는다 → 명령에 인라인으로 붙인다.
#    (script 항목 간 export 지속을 가정하지 않는다.)
#  - PostgreSQL: service 컨테이너(localhost:5432). db:smoke/int 는 비-SUPERUSER·비-BYPASSRLS 역할로 돌려야
#    RLS/redaction 단언이 건너뛰이지 않는다 → rpa_smoke 역할을 만들어 쓴다.
#
# 아래 postgres/rpa_smoke 값은 격리된 CI service 컨테이너 전용 자격이다. 스테이징 SecretStore 프로비저닝
# 증빙이 아니며 배포/런타임 자격으로 재사용하면 안 된다.
image: node:24

definitions:
  caches:
    npmcodegen: codegen/node_modules
    npmapp: app/node_modules
    npmweb: web/node_modules

  services:
    postgres:
      image: postgres:15
      variables:
        POSTGRES_PASSWORD: postgres

  steps:
    - step: &contract-lint
        name: Root contract lint
        script:
          - node scripts/contract-lint.mjs
          - node scripts/test-wiring-audit.mjs
          - node scripts/file-length-gate.mjs

    - step: &blocked-decision-audit
        name: Blocked decision audit
        script:
          - node scripts/blocked-decisions-audit.mjs

    - step: &codegen
        name: Codegen typecheck, fixtures, validators, consistency
        caches:
          - npmcodegen
        script:
          - npm ci --prefix codegen
          - npm --prefix codegen run typecheck
          - npm --prefix codegen run fixtures
          - npm --prefix codegen run validators
          - npm --prefix codegen run consistency
          - npm --prefix codegen run spectral
          - npm --prefix codegen test

    - step: &yaml-parse
        name: Workflow, OpenAPI, and AsyncAPI YAML parse
        script:
          - apt-get update
          - apt-get install --yes --no-install-recommends python3 python3-yaml
          - python3 scripts/yaml-parse.py

    - step: &secret-scan
        name: Secret scan
        script:
          - node scripts/secret-scan.mjs --self-test
          - node scripts/validate-staging-release-packet.mjs --self-test
          - node scripts/validate-controlled-prod-readiness-packet.mjs --self-test
          - node scripts/secret-scan.mjs

    - step: &db-static-smoke
        name: DB static smoke
        script:
          - node scripts/db-static-smoke.mjs

    - step: &k8s-static-smoke
        name: Kubernetes packaging static smoke
        script:
          # 스텝 이름/스크립트에 'deploy' 금지 — yaml-parse.py DEPLOY_MARKERS 가드(계약 전용 CI)가 문자열로 걸러낸다.
          - node scripts/k8s-static-smoke.mjs

    - step: &html-smoke
        name: HTML console smoke
        script:
          - node scripts/html-smoke.mjs
          - node scripts/html-http-smoke.mjs

    - step: &db-migration-smoke
        name: PostgreSQL 15 migration smoke
        services:
          - postgres
        script:
          - apt-get update
          - apt-get install --yes --no-install-recommends postgresql-client
          - |
            set -euo pipefail
            export PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate
            export PGUSER=postgres PGPASSWORD=postgres
            pg_isready -h "$PGHOST" -p "$PGPORT" -U postgres -d postgres
            psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rpa_smoke') THEN
                CREATE ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              ELSE
                ALTER ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              END IF;
            END;
            $$;
            SQL
            psql -v ON_ERROR_STOP=1 -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$PGDATABASE'" | grep -q 1 || createdb --owner rpa_smoke "$PGDATABASE"
            psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER DATABASE $PGDATABASE OWNER TO rpa_smoke"
            # 비-BYPASSRLS 확인: 이 게이트가 없으면 RLS 단언이 조용히 무력화된다.
            psql -v ON_ERROR_STOP=1 -d postgres -Atqc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'rpa_smoke'" | grep -qx f
          - PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate PGUSER=rpa_smoke PGPASSWORD=rpa_smoke node scripts/db-migration-smoke.mjs --require-non-bypass

    - step: &app-runtime
        name: App runtime typecheck and tests
        size: 2x
        services:
          - postgres
        caches:
          - npmcodegen
          - npmapp
          - npmweb
        script:
          - npm ci --prefix codegen
          - npm ci --prefix app
          - npm --prefix app run typecheck
          - npm --prefix app run typecheck:dev
          - npm --prefix app run lint
          - npm --prefix app run test:unit
          # Chrome 하드 가드 — 없으면 e2e/executor 가 조용히 SKIP 되므로 여기서 실패시킨다.
          - apt-get update
          - apt-get install --yes --no-install-recommends chromium fonts-liberation postgresql-client
          - |
            set -euo pipefail
            if [ ! -x /usr/bin/chromium ]; then
              echo "FAIL: chromium is required for executor/pipeline/e2e gates (they SKIP silently without it)"
              exit 1
            fi
            /usr/bin/chromium --version
          - CHROME_PATH=/usr/bin/chromium npm --prefix app run test:executor
          - |
            set -euo pipefail
            export PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate
            export PGUSER=postgres PGPASSWORD=postgres
            pg_isready -h "$PGHOST" -p "$PGPORT" -U postgres -d postgres
            psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rpa_smoke') THEN
                CREATE ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              ELSE
                ALTER ROLE rpa_smoke LOGIN PASSWORD 'rpa_smoke'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              END IF;
            END;
            $$;
            SQL
            psql -v ON_ERROR_STOP=1 -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$PGDATABASE'" | grep -q 1 || createdb --owner rpa_smoke "$PGDATABASE"
            psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER DATABASE $PGDATABASE OWNER TO rpa_smoke"
            psql -v ON_ERROR_STOP=1 -d postgres -Atqc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'rpa_smoke'" | grep -qx f
          # PGADMIN_PASSWORD: runtime-worker-claim.int 가 BYPASSRLS 역할 생성에 postgres 로 접속(격리 service 자격).
          - PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate PGUSER=rpa_smoke PGPASSWORD=rpa_smoke PGADMIN_USER=postgres PGADMIN_PASSWORD=postgres npm --prefix app run test:int
          # 풀스택 D3 파이프라인(driver + 실 Chrome + DB) — Chrome 과 비-bypass DB 가 둘 다 준비된 뒤 실행.
          - PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate PGUSER=rpa_smoke PGPASSWORD=rpa_smoke CHROME_PATH=/usr/bin/chromium npm --prefix app run test:pipeline-run
          - PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate PGUSER=rpa_smoke PGPASSWORD=rpa_smoke CHROME_PATH=/usr/bin/chromium npm --prefix app run test:pipeline-site
          - npm ci --prefix web
          - npm --prefix web run build
          # 라이브 e2e(브라우저 → Fastify → PostgreSQL): 준비도 오너 증빙 5종 게이트 전이 단언 포함.
          - PGHOST=localhost PGPORT=5432 PGDATABASE=rpa_contract_gate PGUSER=rpa_smoke PGPASSWORD=rpa_smoke CHROME_PATH=/usr/bin/chromium npm --prefix app run test:console-live-e2e

    - step: &console
        name: Operations console (web) typecheck, tests, build
        size: 2x
        caches:
          - npmweb
          - npmapp
        script:
          - npm ci --prefix web
          - npm --prefix web run typecheck
          - npm --prefix web run test
          - npm --prefix web run lint:copy
          - npm --prefix web run build
          - npm ci --prefix app
          - apt-get update
          - apt-get install --yes --no-install-recommends chromium fonts-liberation
          - |
            set -euo pipefail
            if [ ! -x /usr/bin/chromium ]; then
              echo "FAIL: chromium is required for the console browser e2e (it SKIPs silently without it)"
              exit 1
            fi
          - CHROME_PATH=/usr/bin/chromium npm --prefix app run test:console-e2e

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *contract-lint
          - step: *blocked-decision-audit
          - step: *codegen
          - step: *yaml-parse
          - step: *secret-scan
          - step: *db-static-smoke
          - step: *k8s-static-smoke
          - step: *html-smoke
          - step: *db-migration-smoke
          - step: *app-runtime
          - step: *console

  branches:
    main:
      - parallel:
          - step: *contract-lint
          - step: *blocked-decision-audit
          - step: *codegen
          - step: *yaml-parse
          - step: *secret-scan
          - step: *db-static-smoke
          - step: *k8s-static-smoke
          - step: *html-smoke
          - step: *db-migration-smoke
          - step: *app-runtime
          - step: *console
