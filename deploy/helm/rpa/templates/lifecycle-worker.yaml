apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpa-lifecycle-worker
  namespace: {{ include "rpa.namespace" . }}
spec:
  replicas: {{ .Values.lifecycleWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rpa-lifecycle-worker
      app.kubernetes.io/component: lifecycle-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpa-lifecycle-worker
        app.kubernetes.io/component: lifecycle-worker
        app.kubernetes.io/part-of: rpa-enterprise
    spec:
      serviceAccountName: rpa-lifecycle-worker
      automountServiceAccountToken: false
{{ with .Values.lifecycleWorker.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | nindent 8 }}
{{ end }}
{{ with .Values.lifecycleWorker.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lifecycle-worker
          image: {{ include "rpa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: rpa-runtime-config
          env:
            - name: RUN_MODE
              value: lifecycle-worker
            - name: PGUSER
              value: {{ .Values.database.appUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.appPassword | quote }}
            - name: ARTIFACT_LIFECYCLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.artifactLifecycleDatabaseUrl | quote }}
            - name: VAULT_ARTIFACT_LIFECYCLE_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultArtifactLifecycleRoleId | quote }}
            - name: VAULT_ARTIFACT_LIFECYCLE_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultArtifactLifecycleSecretId | quote }}
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultAddr | quote }}
            - name: VAULT_MOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultMount | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          resources:
            {{- toYaml .Values.lifecycleWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
