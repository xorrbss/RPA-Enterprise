apiVersion: v1
kind: ConfigMap
metadata:
  name: rpa-runtime-config
  namespace: {{ include "rpa.namespace" . }}
  labels:
    {{- include "rpa.labels" . | nindent 4 }}
data:
  RPA_ENV: {{ .Values.runtime.env | quote }}
  PGHOST: {{ .Values.database.host | quote }}
  PGPORT: {{ .Values.database.port | quote }}
  PGDATABASE: {{ .Values.database.name | quote }}
  PORT: {{ .Values.runtime.apiPort | quote }}
  HEALTH_PORT: {{ .Values.runtime.healthPort | quote }}
  API_LOG_LEVEL: {{ .Values.runtime.apiLogLevel | quote }}
  OTEL_EXPORTER: {{ .Values.runtime.otelExporter | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.runtime.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.runtime.otlpTracesEndpoint | quote }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ .Values.runtime.otlpMetricsEndpoint | quote }}
  SIGNED_COMMAND_REGISTRY_MODE: {{ .Values.runtime.signedCommandRegistryMode | quote }}
  SCENARIO_GENERATION_LLM_V1_ENABLED: {{ .Values.runtime.scenarioGenerationLlmV1Enabled | quote }}
  GRAPHILE_MIGRATIONS_MODE: {{ .Values.runtime.graphileMigrationsMode | quote }}
  GRAPHILE_CONCURRENCY: {{ .Values.runtime.graphileConcurrency | quote }}
  GRAPHILE_POLL_INTERVAL_MS: {{ .Values.runtime.graphilePollIntervalMs | quote }}
  WORKER_ID: {{ .Values.runtime.workerId | quote }}
  ARTIFACT_LIFECYCLE_WORKER_ID: {{ .Values.runtime.lifecycleWorkerId | quote }}
  ARTIFACT_LIFECYCLE_CONSUMER: external
  WORKER_POOL_KEYS: {{ .Values.runtime.workerPoolKeys | quote }}
  MAINTENANCE_TENANT_IDS: {{ .Values.runtime.maintenanceTenantIds | quote }}
  CHROME_EXECUTABLE_PATH: /usr/bin/chromium
  BROWSER_HEADLESS: {{ .Values.runtime.browserHeadless | quote }}
  VISUAL_EVIDENCE_VIDEO_ENABLED: {{ .Values.runtime.videoEnabled | quote }}
  GATEWAY_ARTIFACT_STORE_MODE: {{ .Values.artifactStore.mode | quote }}
  GATEWAY_ARTIFACT_RETENTION_DAYS: "90"
  ARTIFACT_OBJECT_STORE_KIND: {{ .Values.artifactStore.mode | quote }}
  ARTIFACT_OBJECT_STORE_BACKEND_ALIAS: {{ .Values.artifactStore.backendAlias | quote }}
  ARTIFACT_OBJECT_STORE_S3_ENDPOINT: {{ .Values.artifactStore.endpoint | quote }}
  ARTIFACT_OBJECT_STORE_S3_REGION: {{ .Values.artifactStore.region | quote }}
  ARTIFACT_OBJECT_STORE_S3_BUCKET: {{ .Values.artifactStore.bucket | quote }}
  ARTIFACT_OBJECT_STORE_S3_ACCESS_KEY_ID: {{ .Values.artifactStore.accessKeyId | quote }}
  ARTIFACT_OBJECT_STORE_S3_FORCE_PATH_STYLE: {{ .Values.artifactStore.forcePathStyle | quote }}
  GATEWAY_ARTIFACT_OBJECT_STORE_REF: {{ .Values.artifactStore.gatewaySecretRef | quote }}
  ARTIFACT_LIFECYCLE_OBJECT_STORE_MODE: {{ .Values.artifactStore.mode | quote }}
  ARTIFACT_OBJECT_STORE_REF: {{ .Values.artifactStore.lifecycleSecretRef | quote }}
