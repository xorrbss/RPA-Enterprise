{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpa-console
  namespace: {{ include "rpa.namespace" . }}
  labels:
    app.kubernetes.io/name: rpa-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: rpa-enterprise
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rpa-console
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpa-console
        app.kubernetes.io/component: console
        app.kubernetes.io/part-of: rpa-enterprise
    spec:
      serviceAccountName: rpa-console
      automountServiceAccountToken: false
{{ with .Values.console.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | nindent 8 }}
{{ end }}
{{ with .Values.console.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "rpa.consoleImage" . | quote }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RPA_API_UPSTREAM
              value: {{ .Values.console.apiUpstream | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rpa-console
  namespace: {{ include "rpa.namespace" . }}
  labels:
    app.kubernetes.io/name: rpa-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: rpa-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rpa-console
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
{{- end }}
