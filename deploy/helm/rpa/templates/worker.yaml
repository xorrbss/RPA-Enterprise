apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpa-worker
  namespace: {{ include "rpa.namespace" . }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rpa-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpa-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: rpa-enterprise
    spec:
      serviceAccountName: rpa-worker
      automountServiceAccountToken: false
{{ with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | nindent 8 }}
{{ end }}
{{ with .Values.worker.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "rpa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: rpa-runtime-config
          env:
            - name: RUN_MODE
              value: worker
            - name: PGUSER
              value: {{ .Values.database.appUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.appPassword | quote }}
            - name: MAINTENANCE_LIFECYCLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.maintenanceLifecycleDatabaseUrl | quote }}
            - name: CODEX_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.codexBaseUrl | quote }}
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.codexApiKey | quote }}
            - name: CODEX_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.codexModel | quote }}
            - name: VAULT_RUNTIME_WORKER_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultRuntimeWorkerRoleId | quote }}
            - name: VAULT_RUNTIME_WORKER_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultRuntimeWorkerSecretId | quote }}
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultAddr | quote }}
            - name: VAULT_MOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.vaultMount | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
