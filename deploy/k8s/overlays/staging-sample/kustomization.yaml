apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rpa-staging
resources:
  - ../../base
  # 선택 매니페스트는 디렉터리로 참조한다 — kustomize 는 kustomization 루트 바깥의 개별 파일 참조를 거부한다.
  - ../../optional/owner-approved-egress
images:
  - name: ghcr.io/example/rpa-runtime
    newName: registry.owner-approved.invalid/rpa-runtime
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  - name: ghcr.io/example/rpa-console
    newName: registry.owner-approved.invalid/rpa-console
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
commonAnnotations:
  rpa.example.com/sample-overlay: "true"
  rpa.example.com/release-artifact: "false"
  rpa.example.com/owner-approved-egress-cidrs-required: "true"
patches:
  - target:
      kind: Namespace
      name: rpa-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: rpa-staging
  - target:
      kind: NetworkPolicy
      name: rpa-owner-approved-egress
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 192.0.2.10/32
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 192.0.2.20/32
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 198.51.100.10/32
      - op: replace
        path: /spec/egress/3/to/0/ipBlock/cidr
        value: 198.51.100.20/32
      - op: replace
        path: /spec/egress/4/to/0/ipBlock/cidr
        value: 203.0.113.10/32
