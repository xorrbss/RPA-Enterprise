apiVersion: v1
kind: ConfigMap
metadata:
  name: rpa-runtime-config
  namespace: rpa-system
  labels:
    app.kubernetes.io/name: rpa-runtime-config
    app.kubernetes.io/part-of: rpa-enterprise
data:
  RPA_ENV: staging
  PGHOST: rpa-postgres.example.internal
  PGPORT: "5432"
  PGDATABASE: rpa
  PORT: "8080"
  HEALTH_PORT: "8081"
  API_LOG_LEVEL: info
  OTEL_EXPORTER: console
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""
  SIGNED_COMMAND_REGISTRY_MODE: deny_all
  SCENARIO_GENERATION_LLM_V1_ENABLED: "false"
  GRAPHILE_MIGRATIONS_MODE: external
  GRAPHILE_CONCURRENCY: "1"
  GRAPHILE_POLL_INTERVAL_MS: "2000"
  WORKER_ID: "10000000-0000-4000-8000-0000000000aa"
  ARTIFACT_LIFECYCLE_WORKER_ID: "20000000-0000-4000-8000-0000000000aa"
  ARTIFACT_LIFECYCLE_CONSUMER: external
  WORKER_POOL_KEYS: ""
  MAINTENANCE_TENANT_IDS: ""
  CHROME_EXECUTABLE_PATH: /usr/bin/chromium
  BROWSER_HEADLESS: "true"
  VISUAL_EVIDENCE_VIDEO_ENABLED: "false"
  GATEWAY_ARTIFACT_STORE_MODE: s3
  GATEWAY_ARTIFACT_RETENTION_DAYS: "90"
  ARTIFACT_OBJECT_STORE_KIND: s3
  ARTIFACT_OBJECT_STORE_BACKEND_ALIAS: s3-compatible
  ARTIFACT_OBJECT_STORE_S3_ENDPOINT: https://object-store.example.internal
  ARTIFACT_OBJECT_STORE_S3_REGION: ap-northeast-2
  ARTIFACT_OBJECT_STORE_S3_BUCKET: rpa-artifacts
  ARTIFACT_OBJECT_STORE_S3_ACCESS_KEY_ID: rpa-artifact-writer
  ARTIFACT_OBJECT_STORE_S3_FORCE_PATH_STYLE: "true"
  GATEWAY_ARTIFACT_OBJECT_STORE_REF: rpa/staging/runtime-worker/object_store/artifacts
  ARTIFACT_LIFECYCLE_OBJECT_STORE_MODE: s3
  ARTIFACT_OBJECT_STORE_REF: rpa/staging/artifact-lifecycle/object_store/artifacts
