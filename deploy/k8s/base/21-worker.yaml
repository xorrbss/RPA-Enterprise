apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpa-worker
  namespace: rpa-system
  labels:
    app.kubernetes.io/name: rpa-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: rpa-enterprise
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rpa-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpa-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: rpa-enterprise
    spec:
      serviceAccountName: rpa-worker
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rpa-worker
              app.kubernetes.io/component: worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rpa-worker
                    app.kubernetes.io/component: worker
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # 브라우저 워커만 Unconfined. Chromium 의 user-namespace 샌드박스는 namespace clone 을 요구하는데
        # RuntimeDefault 프로파일이 이를 막아 샌드박스가 서지 못하고("Operation not permitted") 워커가 모든 run 을
        # INIT 실패로 재큐한다. runAsNonRoot·capabilities drop·allowPrivilegeEscalation:false 는 그대로 두고
        # seccomp 필터만 푼다 — **브라우저 샌드박스는 켜진 채로** 동작한다(--no-sandbox 회피 금지).
        # ⚠ restricted PodSecurity 를 강제하는 네임스페이스는 Unconfined 를 금지한다 — 그 경우 오너가
        #   Localhost 프로파일(런타임 기본 + namespace clone 허용)을 노드에 배포해 type: Localhost 로 바꿔야 한다.
        seccompProfile:
          type: Unconfined
      containers:
        - name: worker
          image: ghcr.io/example/rpa-runtime:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: rpa-runtime-config
          env:
            - name: RUN_MODE
              value: worker
            - name: PGUSER
              value: rpa_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: RPA_APP_DB_PASSWORD
            - name: MAINTENANCE_LIFECYCLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: MAINTENANCE_LIFECYCLE_DATABASE_URL
            - name: CODEX_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: CODEX_BASE_URL
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: CODEX_API_KEY
            - name: CODEX_MODEL
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: CODEX_MODEL
            - name: VAULT_RUNTIME_WORKER_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: VAULT_RUNTIME_WORKER_ROLE_ID
            - name: VAULT_RUNTIME_WORKER_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: VAULT_RUNTIME_WORKER_SECRET_ID
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: VAULT_ADDR
            - name: VAULT_MOUNT
              valueFrom:
                secretKeyRef:
                  name: rpa-runtime-secrets
                  key: VAULT_MOUNT
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
