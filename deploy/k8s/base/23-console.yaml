apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpa-console
  namespace: rpa-system
  labels:
    app.kubernetes.io/name: rpa-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: rpa-enterprise
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rpa-console
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpa-console
        app.kubernetes.io/component: console
        app.kubernetes.io/part-of: rpa-enterprise
    spec:
      serviceAccountName: rpa-console
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rpa-console
              app.kubernetes.io/component: console
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rpa-console
                    app.kubernetes.io/component: console
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/example/rpa-console:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RPA_API_UPSTREAM
              value: http://rpa-api:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rpa-console
  namespace: rpa-system
  labels:
    app.kubernetes.io/name: rpa-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: rpa-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rpa-console
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 8080
      targetPort: http
