apiVersion: v1
kind: Secret
metadata:
  name: rpa-runtime-secrets
  namespace: rpa-system
  labels:
    app.kubernetes.io/name: rpa-runtime-secrets
    app.kubernetes.io/part-of: rpa-enterprise
type: Opaque
stringData:
  RPA_MIGRATOR_DB_PASSWORD: replace-outside-repo
  RPA_APP_DB_PASSWORD: replace-outside-repo
  JWT_HS256_SECRET: replace-with-at-least-32-characters-outside-repo
  MAINTENANCE_LIFECYCLE_DATABASE_URL: REPLACE_WITH_SECRETSTORE_DSN
  ARTIFACT_LIFECYCLE_DATABASE_URL: REPLACE_WITH_SECRETSTORE_DSN
  CODEX_BASE_URL: https://api.openai.com
  CODEX_API_KEY: replace-outside-repo
  CODEX_MODEL: replace-outside-repo
  VAULT_ADDR: https://vault.example.internal
  VAULT_MOUNT: secret
  VAULT_RUNTIME_WORKER_ROLE_ID: replace-outside-repo
  VAULT_RUNTIME_WORKER_SECRET_ID: replace-outside-repo
  VAULT_API_ROLE_ID: replace-outside-repo
  VAULT_API_SECRET_ID: replace-outside-repo
  VAULT_ARTIFACT_LIFECYCLE_ROLE_ID: replace-outside-repo
  VAULT_ARTIFACT_LIFECYCLE_SECRET_ID: replace-outside-repo
